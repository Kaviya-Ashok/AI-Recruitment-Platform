<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Intelligence Platform - mockup v3 (enterprise style)</title>
<style>
:root{
  --bg:#F9FAFB; --surface:#FFFFFF; --border:#E4E7EC; --border2:#D0D5DD;
  --text:#101828; --text2:#475467; --text3:#667085;
  --accent:#2E6E4E; --accent-d:#245A3F; --accent-bg:#EAF3EE;
  --ok:#067647; --ok-bg:#ECFDF3; --warn:#B54708; --warn-bg:#FFFAEB;
  --err:#B42318; --err-bg:#FEF3F2; --info:#175CD3; --info-bg:#EFF8FF; --neu:#344054; --neu-bg:#F2F4F7;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid #5B9BF8;outline-offset:2px}
svg{flex:none}
/* top bar */
.top{position:sticky;top:0;z-index:30;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px}
.wordmark{display:flex;align-items:center;gap:10px;font-weight:600;width:200px}
.wordmark i{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.search{position:relative;flex:0 1 460px}
.search input{width:100%;height:36px;border:1px solid var(--border2);border-radius:8px;padding:0 12px 0 34px;background:#fff;font:inherit;color:var(--text)}
.search svg{position:absolute;left:11px;top:10px;color:var(--text3)}
.results{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.12);display:none;overflow:hidden}
.results button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border:0;background:#fff;text-align:left}
.results button:hover{background:var(--bg)}
.results .sub{color:var(--text3);font-size:12px;margin-left:auto}
.user{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--neu-bg);color:var(--neu);display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid var(--border)}
.user .who{line-height:1.2;font-size:13px}.user .who small{display:block;color:var(--text3);font-size:12px}
/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:56px;height:calc(100vh - 56px);display:flex;flex-direction:column}
.side .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);padding:6px 10px}
.side button.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--text2);font-weight:500}
.side button.nav:hover{background:var(--bg)}
.side button.nav[aria-current="page"]{background:var(--accent-bg);color:var(--accent-d);font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--text3);padding:10px}
.content{padding:20px 32px 64px;max-width:1320px;width:100%}
.note-bar{display:flex;justify-content:space-between;gap:12px;background:var(--info-bg);color:var(--info);border:1px solid #B2DDFF;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.note-bar button{border:0;background:none;color:var(--info)}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--text3);font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--text3);padding:0}.crumbs button:hover{color:var(--text);text-decoration:underline}
.crumbs .cur{color:var(--text);font-weight:500}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
h3{font-size:14px;margin:0 0 6px;font-weight:600}
.sub{color:var(--text3)} .small{font-size:12.5px} .num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:34px;padding:0 13px;border:1px solid var(--border2);background:#fff;border-radius:8px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;color:var(--text)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-d)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-d)}.btn.ghost:hover{background:var(--accent-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px 1px 7px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.neu{background:var(--neu-bg);color:var(--neu)}
.tag{display:inline-block;border:1px solid var(--border2);border-radius:6px;padding:0 6px;font-size:12px;color:var(--text2);font-weight:500;background:#fff}
.tag.ai{border-color:#B2DDFF;color:var(--info);background:var(--info-bg)}
.code{font-variant-numeric:tabular-nums;font-size:12px;border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:0 6px;color:var(--text2);margin-right:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.card>.hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card>.bd{padding:16px 18px}
.card>.hd h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.kpis>div{padding:14px 18px;border-right:1px solid var(--border)}.kpis>div:last-child{border-right:0}
.kpis .l{color:var(--text3);font-size:12.5px}.kpis .v{font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpis .v small{font-size:13px;color:var(--text3);font-weight:500}
/* tables */
.tbl{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tbl .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tbl .bar input{height:32px;border:1px solid var(--border2);border-radius:8px;padding:0 10px;min-width:220px;font:inherit}
.chip{height:28px;border:1px solid var(--border2);background:#fff;border-radius:999px;padding:0 12px;font-size:13px;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:#BFD9CA;color:var(--accent-d);font-weight:600}
table{border-collapse:collapse;width:100%}
th{background:var(--bg);color:var(--text3);font-size:12px;font-weight:600;text-align:left;padding:9px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.go:hover{background:var(--bg);cursor:pointer}
th.num,td.num{text-align:right}
.lnk{border:0;background:none;padding:0;color:var(--text);font-weight:600}.lnk:hover{color:var(--accent-d);text-decoration:underline}
.nm small{display:block;color:var(--text3);font-weight:400;font-size:12.5px}
/* job stages */
.stages{display:flex;border-bottom:1px solid var(--border);margin:6px 0 20px;gap:2px;overflow:auto}
.stg{display:flex;gap:10px;align-items:center;padding:11px 18px 12px;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text2);white-space:nowrap}
.stg:hover{color:var(--text)}
.stg .c{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--text3)}
.stg.done .c{background:var(--accent);border-color:var(--accent);color:#fff}
.stg.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.stg.on:not(.done) .c{border-color:var(--accent);color:var(--accent)}
.stg .t{display:block;line-height:1.2}.stg .t small{display:block;font-weight:400;color:var(--text3);font-size:12px}
.badge-n{min-width:18px;height:18px;border-radius:9px;background:var(--err-bg);color:var(--err);font-size:11.5px;font-weight:600;display:inline-grid;place-items:center;padding:0 5px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 16px}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--accent-d);border-bottom-color:var(--accent);font-weight:600}
/* candidate */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.metrics>div{padding:12px 16px;border-right:1px solid var(--border)}.metrics>div:last-child{border-right:0}
.metrics .l{color:var(--text3);font-size:12.5px}.metrics .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.metrics .v small{font-size:12.5px;color:var(--text3);font-weight:500}
.prog{list-style:none;margin:0;padding:0}
.prog li button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:7px 0;text-align:left;color:var(--text2)}
.prog li button:hover{color:var(--text)}
.prog .dotc{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);display:grid;place-items:center;color:#fff}
.prog li.done .dotc{background:var(--accent);border-color:var(--accent)}
.prog li.todo .dotc{background:#fff}
.prog li.warn .dotc{border-color:var(--warn);background:var(--warn-bg)}
.prog small{margin-left:auto;color:var(--text3);font-size:12px}
.next{background:var(--accent-bg);border:1px solid #BFD9CA;border-radius:10px;padding:14px 16px}
.next h3{color:var(--accent-d);margin-bottom:4px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--text3)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px}.kv dt{color:var(--text3)}.kv dd{margin:0}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}.feed li:last-child{border-bottom:0}
.feed time{margin-left:auto;color:var(--text3);font-size:12px;white-space:nowrap}
.meter{height:6px;background:var(--neu-bg);border-radius:4px;overflow:hidden;min-width:90px}.meter i{display:block;height:100%;background:var(--accent)}
.alert{display:flex;gap:10px;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;align-items:flex-start}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.err{background:var(--err-bg);color:var(--err)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cols3 ul{margin:4px 0 0;padding-left:18px}
details{border:1px solid var(--border);border-radius:8px;margin:10px 0;background:#fff}
summary{padding:9px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
details>div{padding:0 14px 12px}
label.f{display:block;font-weight:600;margin:12px 0 5px;font-size:13px}
input[type=text],textarea,select{width:100%;border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
.seg{display:flex;gap:8px}.seg label{flex:1;border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-weight:600;display:flex;gap:8px;align-items:center;cursor:pointer;background:#fff}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent)}
.err-t{color:var(--err);font-size:13px;margin:8px 0;min-height:18px}
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;place-items:center;z-index:50}
.overlay.on{display:grid}
.modal{width:min(580px,94vw);background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(16,24,40,.25)}
.modal .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal .bd{padding:6px 20px 14px}.modal .ft{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg);border-radius:0 0 12px 12px}
.toast{position:fixed;left:24px;bottom:24px;background:#101828;color:#fff;padding:10px 14px;border-radius:8px;font-size:13.5px;display:none;max-width:480px;z-index:60}
.view{display:none}.view.on{display:block}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--neu-bg)}
@media (max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.detail{grid-template-columns:1fr}.rail{position:static}.kpis,.metrics,.cols3{grid-template-columns:1fr 1fr}.wordmark{width:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wordmark"><i>RI</i><span>Recruitment Intelligence</span></div>
  <div class="search" id="gsearch">
    <span id="ic-search"></span>
    <input id="gs-input" type="text" placeholder="Search candidates or jobs" aria-label="Search candidates or jobs" autocomplete="off">
    <div class="results" id="gs-results" role="listbox"></div>
  </div>
  <div class="user"><div class="who"><b style="font-weight:600">Alice Groove</b><small>Admin</small></div><div class="avatar">AG</div></div>
</header>
<div class="shell">
  <aside class="side">
    <div class="lbl">WORKSPACE</div>
    <button class="nav" data-view="dashboard"></button>
    <button class="nav" data-view="jobs"></button>
    <button class="nav" data-view="candidates"></button>
    <div class="foot">MVP · sample data</div>
  </aside>
  <div class="content" id="content">
    <div class="note-bar" id="notebar"><span><b>Mockup v3.</b> Sample data, nothing is saved. Try the search box, the stage bar, a candidate page, and the Record decision button.</span><button onclick="document.getElementById('notebar').style.display='none'" aria-label="Dismiss" id="ic-x"></button></div>
    <div class="crumbs" id="crumbs"></div>
    <section class="view" id="v-dashboard"></section>
    <section class="view" id="v-jobs"></section>
    <section class="view" id="v-job"></section>
    <section class="view" id="v-candidates"></section>
    <section class="view" id="v-candidate"></section>
  </div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  check:'<polyline points="20 6 9 17 4 12"/>', right:'<polyline points="9 18 15 12 9 6"/>', left:'<polyline points="15 18 9 12 15 6"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'
};
const ic = (n,s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const pill = (k,t) => `<span class="pill ${k}">${esc(t)}</span>`;
const DEC = {PROCEED:['ok','Proceed'], HOLD:['warn','Hold'], REJECT:['err','Reject']};
const decPill = d => d ? pill(DEC[d][0],DEC[d][1]) : pill('neu','No decision');
const confPill = c => pill(c==='High'?'ok':c==='Medium'?'warn':'neu', c);
let tt; function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3600);}

/* ---------- sample data ---------- */
const JOB = {code:'V_003', title:'Data Scientist (Fresher / Entry-Level)', status:'Open'};
const cands = {
  rohan:{name:'Rohan Iyer', init:'RI', email:'rohan.iyer@example.com', screening:10.00, sconf:'High', buckets:[['Requirements',10],['Experience',10],['Behavioral',10]], interview:7.67, final:8.60, rank:1, prerank:2, conf:'Medium', status:'ranked',
    decision:'PROCEED', rationale:'Strongest interview evidence of the candidates reviewed. Clear forecasting project, correct SQL answers and good data-quality checks. Gaps (deployment, deep learning) are teachable. Proceeding to the next stage.', history:[], decidedAt:'6 Oct 2026, 15:10',
    rounds:[{n:1, rec:'PROCEED', ratings:[['Analytical skills',4],['Python',4],['SQL',4]], mean:4.00, notes:'Walked through the demand-forecasting internship clearly; sensible metric choice.', tr:'Rohan_Iyer_Transcript_R1.docx', trm:'v1 · 11 KB'},
            {n:2, rec:'PROCEED', ratings:[['AI',4],['Cloud skills',3],['Model building',4]], mean:3.67, notes:'Good production thinking; no CI/CD experience yet.', tr:'Rohan_Iyer_Transcript_R2.docx', trm:'v1 · 10 KB'}],
    analysis:{conf:'Medium', rec:'HOLD', scope:'Based on interviewer feedback for rounds 1 and 2 and the interview transcripts for rounds 1 and 2.', summary:'Broad coverage of the mandatory requirements, confirmed by first-hand technical detail in both rounds. Open points remain on production deployment and the number of products covered at the internship (60 versus about 80).',
      strengths:['Forecasting project with a sound evaluation approach','Correct SQL window-function answers','Automated data-quality checks'], gaps:['No CI/CD or deployment experience'], unknowns:['Whether the product count was 60 or about 80','Cloud skills beyond AWS Athena basics']},
    feed:[['Decision recorded: Proceed','6 Oct, 15:10'],['Final ranking generated','6 Oct, 15:12'],['AI analysis generated','6 Oct, 14:50'],['Transcript attached, round 2','6 Oct, 14:31'],['Interview feedback recorded, round 2','6 Oct, 14:28']]},
  ananya:{name:'Ananya Sharma', init:'AS', email:'ananya.sharma@example.com', screening:10.00, sconf:'Medium', buckets:[['Requirements',10],['Experience',10],['Behavioral',10]], interview:5.67, final:7.40, rank:2, prerank:1, conf:'Medium', status:'ranked',
    decision:'HOLD', rationale:'Solid fundamentals but moderate interview ratings, with analytical skills 2 of 5 in round 1. Holding until the panel confirms whether this reflects a real gap.', history:[], decidedAt:'6 Oct, 15:11',
    rounds:[{n:1, rec:'HOLD', ratings:[['Analytical skills',2],['Python',3],['SQL',3]], mean:2.67, notes:'Good SQL window-function answer; analytical depth uneven.', tr:'Ananya_Sharma_Transcript_R1.docx', trm:'v1 · 11 KB'},
            {n:2, rec:'PROCEED', ratings:[['AI',3],['Cloud skills',3],['Model building',3]], mean:3.00, notes:'Honest about gaps; improved since round 1.', tr:'Ananya_Sharma_Transcript_R2.docx', trm:'v1 · 12 KB'}],
    analysis:{conf:'Medium', rec:'HOLD', scope:'Based on interviewer feedback for rounds 1 and 2 and the interview transcripts for rounds 1 and 2.', summary:'Meets the mandatory education and core technical requirements. Interview ratings are moderate and the notes do not explain them, so the analysis does not settle whether her analytical ability is strong or moderate.',
      strengths:['Churn project with recall-focused evaluation','Disclosed and fixed a data-leakage mistake'], gaps:['No cloud or deployment experience'], unknowns:['Analytical depth (2 of 5 in round 1, no notes)','Hands-on pipeline testing tools']},
    feed:[['Decision recorded: Hold','6 Oct, 15:11'],['Final ranking generated','6 Oct, 15:12'],['AI analysis generated','6 Oct, 14:52'],['Transcript attached, round 2','6 Oct, 14:20'],['Interview feedback recorded, round 2','6 Oct, 14:18']]},

  const warn=c.status!=='ranked'?`<div class="alert ${c.status==='ineligible'?'err':'warn'}">${ic('alert',16)}<span>${esc(c.reason)}</span></div>`:'';
  return `${warn}<div class="card"><div class="hd"><h2>Summary</h2></div><div class="bd"><dl class="kv">
    <dt>Screening</dt><dd>${c.screening.toFixed(2)} / 10, confidence ${confPill(c.sconf)}</dd>
    <dt>Interview</dt><dd>${c.interview!=null?c.interview.toFixed(2)+' / 10 across '+c.rounds.filter(r=>r.ratings.length).length+' rated round(s)':'Not available'}</dd>
    <dt>Final</dt><dd>${c.final!=null?c.final.toFixed(2)+' / 10 · '+(c.rank?'rank #'+c.rank:'not ranked'):'Not available'}</dd>
    <dt>Confidence</dt><dd>${c.conf==='-'?'-':confPill(c.conf)}</dd>
    <dt>AI analysis</dt><dd>${c.analysis?pill('info','Generated'):pill('neu','Not generated')}</dd></dl></div></div>
  <div class="card"><div class="hd"><h2>Activity</h2></div><div class="bd" style="padding-top:6px"><ul class="feed">${c.feed.map(f=>`<li><span>${esc(f[0])}</span><time>${f[1]}</time></li>`).join('')}</ul></div></div>`;
}
function cScreening(c){
  return `<div class="card"><div class="hd"><h2>Screening result</h2><span>${confPill(c.sconf)}</span></div><table><thead><tr><th>Bucket</th><th class="num">Score</th><th style="width:200px">Coverage</th></tr></thead><tbody>${c.buckets.map(b=>`<tr><td>${b[0]}</td><td class="num">${b[1]} / 10</td><td><div class="meter"><i style="width:${b[1]*10}%"></i></div></td></tr>`).join('')}</tbody></table></div>
  <div class="sub small" style="margin-bottom:10px">Scores come from fixed rules. The AI only judged each requirement as pass, fail or unknown.</div>
  <details><summary>Screening transcript</summary><div><p><b>Q.</b> Tell me about a project where you cleaned messy data.</p><p class="sub">Sample answer text from the candidate appears here.</p><p><b>Q.</b> Have you used a cloud data warehouse?</p><p class="sub">Sample answer text from the candidate appears here.</p></div></details>`;
}
function cInterview(c){
  const rounds=c.rounds.map(r=>`<div class="card"><div class="hd"><h2>Round ${r.n}</h2><span class="row"><span class="sub small">Interviewer recommends</span>${decPill(r.rec)}</span></div><div class="bd">
   ${r.ratings.length?`<table style="border:1px solid var(--border);border-radius:8px;overflow:hidden"><thead><tr><th>Competency</th><th class="num">Rating</th></tr></thead><tbody>${r.ratings.map(x=>`<tr><td>${x[0]}</td><td class="num">${x[1]} / 5</td></tr>`).join('')}<tr><td class="sub">Round mean</td><td class="num"><b>${r.mean.toFixed(2)}</b> / 5</td></tr></tbody></table>`:`<div class="alert warn">${ic('alert',16)}<span>No competency ratings were recorded for this round.</span></div>`}
   <dl class="kv" style="margin-top:12px"><dt>Notes</dt><dd>${esc(r.notes)}</dd><dt>Transcript</dt><dd>${r.tr?`${esc(r.tr)} <span class="sub small">${r.trm}</span> <button class="btn sm" style="margin-left:8px" onclick="toast('Mockup: downloads the file.')">${ic('down',14)}Download</button> <button class="btn sm ghost" onclick="toast('Mockup: replaces it and keeps the old version.')">Replace</button>`:`<span class="sub">None attached</span> <button class="btn sm ghost" onclick="toast('Mockup: opens a file chooser (PDF or DOCX).')">Attach</button>`}</dd></dl></div></div>`).join('');
  return `<details><summary>Interview guide</summary><div class="sub small">Technical, résumé-validation, behavioural and probing questions are listed here, each with the reason it was asked.</div></details>${rounds}
  <details><summary>Record another round</summary><div><div class="cols3"><div><label class="f">Competency</label><input type="text" placeholder="e.g. System design"></div><div><label class="f">Rating</label><select><option>-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div><label class="f">Comment</label><input type="text" placeholder="What you observed"></div></div>
   <label class="f">Interview notes</label><textarea placeholder="What happened in the interview, in your own words."></textarea>
   <label class="f">Transcript (optional, PDF or DOCX, up to 10 MB)</label><input type="text" readonly placeholder="Choose a file">
   <div style="margin-top:12px"><button class="btn primary" onclick="toast('Mockup: nothing is saved.')">Save feedback</button></div></div></details>`;
}
function cAnalysis(c){
  const a=c.analysis;
  if(!a) return `<div class="card"><div class="bd"><h3>No AI analysis yet</h3><div class="sub" style="margin-bottom:10px">It reads the résumé, screening, all interview rounds and transcripts. It is optional and does not decide anything.</div><button class="btn primary" onclick="toast('Mockup: runs one AI call.')">Generate analysis</button></div></div>`;
  return `<div class="row" style="margin-bottom:8px"><span class="tag ai">AI-generated</span><span class="sub small">6 Oct 2026 · requested by Alice Groove · claude-sonnet-5</span></div>
  <div class="sub small" style="margin-bottom:10px">${a.scope}</div>
  <div class="card"><div class="bd"><div class="row" style="margin-bottom:8px"><span class="sub">AI recommends</span>${decPill(a.rec)}<span class="sub" style="margin-left:10px">Confidence</span>${confPill(a.conf)}</div>
   <div class="sub small">Interviewer recommendations: ${c.rounds.map(r=>'Round '+r.n+' '+DEC[r.rec][1]).join(', ')}. The AI analysis did not see these, and no comparison is made.</div></div></div>
  <div class="card"><div class="hd"><h2>Summary</h2></div><div class="bd">${a.summary}</div></div>
  <div class="cols3"><div class="card"><div class="hd"><h2>Strengths</h2></div><div class="bd"><ul>${a.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div></div><div class="card"><div class="hd"><h2>Gaps</h2></div><div class="bd"><ul>${a.gaps.map(s=>`<li>${s}</li>`).join('')}</ul></div></div><div class="card"><div class="hd"><h2>Unknowns</h2></div><div class="bd"><ul>${a.unknowns.map(s=>`<li>${s}</li>`).join('')}</ul></div></div></div>
  <div class="row"><button class="btn" onclick="toast('Mockup: the current analysis is kept as an earlier version.')">Regenerate</button></div><details><summary>Earlier analyses (0)</summary><div class="sub small">None yet.</div></details>`;
}
function cScorecard(c){
  if(c.final==null) return `<div class="alert warn">${ic('alert',16)}<span>No final score yet. ${esc(c.reason||'')}</span></div>`;
  return `<div class="card"><div class="hd"><h2>Final score</h2><b>${c.final.toFixed(2)} / 10</b></div><table><thead><tr><th>Component</th><th class="num">Score</th><th class="num">Weight</th><th class="num">Contribution</th></tr></thead><tbody>
   <tr><td>Screening</td><td class="num">${c.screening.toFixed(2)}</td><td class="num">40%</td><td class="num">${(c.screening*.4).toFixed(2)}</td></tr>
   <tr><td>Interview, all rounds equal</td><td class="num">${c.interview.toFixed(2)}</td><td class="num">60%</td><td class="num">${(c.interview*.6).toFixed(2)}</td></tr></tbody></table></div>
  <div class="sub small" style="margin-bottom:12px">${c.rank?'Rank #'+c.rank+'. ':'Not ranked. '}Confidence ${c.conf}: the lowest of the screening and analysis confidence, capped at Medium when no analysis exists.</div>
  <div class="card"><div class="hd"><h2>Evidence on record</h2></div><div class="bd"><dl class="kv"><dt>Résumé and application</dt><dd>${pill('ok','On record')}</dd><dt>Screening evaluation</dt><dd>${pill('ok','On record')}</dd><dt>Interview feedback</dt><dd>${pill('ok',c.rounds.length+' round(s)')}</dd><dt>Transcripts</dt><dd>${c.rounds.some(r=>r.tr)?pill('ok','Attached'):pill('neu','None')}</dd><dt>AI analysis</dt><dd>${c.analysis?pill('info','Generated'):pill('neu','Not generated')}</dd><dt>AI-human disagreement</dt><dd>Not yet evaluated</dd></dl></div></div>`;
}
function cDecision(c){
  const cur=c.decision?`<div class="card"><div class="hd"><h2>Current decision</h2>${decPill(c.decision)}</div><div class="bd"><div class="sub small">Decided by Alice Groove, ${c.decidedAt||'just now'}</div><p style="margin-bottom:0">${esc(c.rationale)}</p></div></div>`:`<div class="alert info">${ic('info',16)}<span>No final decision has been recorded yet.</span></div>`;
  const hist=c.history.length?`<div class="card"><div class="hd"><h2>Earlier decisions (${c.history.length})</h2></div><table><tbody>${c.history.map(h=>`<tr><td style="width:110px">${decPill(h.d)}</td><td>${esc(h.r)}</td></tr>`).join('')}</tbody></table></div>`:'';
  return `${cur}${hist}<button class="btn primary" onclick="openModal()">${c.decision?'Change decision':'Record decision'}</button>`;
}

/* ---------- decision modal ---------- */
function openModal(){
  const c=cands[S.cand];
  $('#modal').innerHTML=`<div class="hd"><h2 id="mtitle" style="margin:0;font-size:16px">${c.decision?'Change':'Record'} final decision, ${esc(c.name)}</h2><button class="btn sm ghost" onclick="closeModal()" aria-label="Close">${ic('x',16)}</button></div>
  <div class="bd"><label class="f">Decision</label><div class="seg" role="radiogroup"><label><input type="radio" name="dec" value="PROCEED">Proceed</label><label><input type="radio" name="dec" value="HOLD">Hold</label><label><input type="radio" name="dec" value="REJECT">Reject</label></div>
   <label class="f" for="rat">Rationale (required)</label><textarea id="rat" placeholder="Why this decision, in your own words." oninput="$('#cnt').textContent=this.value.trim().length"></textarea>
   <div class="sub small">10 to 2000 characters (<span id="cnt">0</span>). Base the decision on job-relevant evidence only.</div>
   <label class="f" style="font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" id="conf">I have reviewed the scorecard, interview feedback and analysis</label>
   <div class="err-t" id="derr" role="alert"></div><div class="sub small">Recorded only. This does not notify the candidate or change any status.</div></div>
  <div class="ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitDecision()">Record decision</button></div>`;
  $('#overlay').classList.add('on');
}
function closeModal(){$('#overlay').classList.remove('on');}
function submitDecision(){
  const c=cands[S.cand], sel=document.querySelector('input[name=dec]:checked'), r=$('#rat').value.trim(), e=$('#derr');
  if(!sel){e.textContent='Choose Proceed, Hold or Reject.';return;}
  if(r.length<10){e.textContent='The rationale must be at least 10 characters.';return;}
  if(r.length>2000){e.textContent='The rationale must be 2000 characters or fewer.';return;}
  if(!$('#conf').checked){e.textContent='Confirm that you have reviewed the evidence.';return;}
  if(c.decision) c.history.unshift({d:c.decision,r:c.rationale});
  c.decision=sel.value; c.rationale=r; c.decidedAt='just now'; c.feed.unshift(['Decision recorded: '+DEC[sel.value][1],'just now']);
  closeModal(); render(); toast('Decision recorded. Nobody is notified and no status changes (mockup: nothing is saved).');
}
setupSearch(); render();
</script>
</body>
